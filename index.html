<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

<div class="max-w-md mx-auto">
    <h1 id ="mainHeading" class="text-2xl font-bold text-center my-6">INCOME AND EXPENSE CALCUTOR</h1>
    <div class="bg-white rounded-xl p-4 shadow mb-4 grid grid-cols-3 text-center">
        <div>
            <p class="text-xs text-gray-500">Balance</p>
            <p class="balance" class="font-bold text-lg">₹0</p>
        </div>
        <div>
            <p class="text-xs text-gray-500">Income</p>
            <p id="income" class="font-bold text-lg">₹0</p>
        </div>
        <div>
            <p class="text-xs text-gray-500">Expense</p>
            <p id="expense" class="font-bold text-lg">₹0</p>
        </div>
    </div>

    <div class="bg-white rounded-xl p-4 shadow mb-4">
        <select id="type" class="w-full border rounded-lg p-3 mb-2">
            <option value="income">INCOME</option>
            <option value="expense">EXPENSE</option>
        </select>
        <input id="category" placeholder="Category e.g. Food" class="w-full border rounded-lg p-3 mb-2">
        <input id="amount" type="number" placeholder="Amount" class="w-full border rounded-lg p-3 mb-3">
        <button id="addBtn" class="w-full bg-black text-white rounded-lg p-3 font-semibold">Add Transaction</button>
    </div>

    <div class="bg-white rounded-xl p-4 shadow">
        <h2 class="font-semibold mb-2">TRANSACTION</h2>
        <ul id="list" class="divide-y"></ul>
        <p id="loading" class="text-center text-gray-400 text-sm mt-2">No transactions yet</p>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
